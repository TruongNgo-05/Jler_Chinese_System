spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: jler_chinese_system
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/jler_chinese_system?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
server:
  port: ${SERVER_PORT:8080}
file:
  upload-dir: ${UPLOAD_DIR:uploads}
app:
  jwt-secret: ${JWT_SECRET}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  seed-demo: ${SEED_DEMO:false}
  admin-password: ${ADMIN_PASSWORD}
  sepay:
    enabled: ${SEPAY_ENABLED:false}
    webhook-key: ${SEPAY_WEBHOOK_KEY:}
    bank-code: ${SEPAY_BANK_CODE:}
    gateway: ${SEPAY_GATEWAY:}
    account-number: ${SEPAY_ACCOUNT_NUMBER:}
    account-name: ${SEPAY_ACCOUNT_NAME:}
    sub-account: ${SEPAY_SUB_ACCOUNT:}
